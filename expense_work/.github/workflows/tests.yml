name: Flask tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run Python syntax checks
        run: python -m compileall -q app.py tests
      - name: Run backend tests
        env:
          SECRET_KEY: ci-test-secret-key-long-enough
          FLASK_DEBUG: "false"
        run: pytest -q
